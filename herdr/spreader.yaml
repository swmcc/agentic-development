# herdr-spreader workspace config
# Install: cargo install herdr-spreader
# Run: herdr-spreader apply --file ~/.config/herdr/spreader.yaml
#
# Standard layout per workspace:
#   agentic  - claude code (left pane) + codex (right pane)
#   git      - lazygit
#   obsidian - plain shell
#   system   - plain shell

workspaces:
  - name: second_breakfast
    root: ~/Code/second_breakfast
    tabs:
      - label: agentic
        panes:
          - command: claude
          - command: codex
      - label: git
        panes:
          - command: lazygit
      - label: obsidian
        panes:
          - command: zsh
      - label: system
        panes:
          - command: zsh


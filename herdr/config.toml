[keys]
prefix = "ctrl+a"
goto = "prefix+f"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec bash -c 'read -rp \"Label: \" l; [ -n \"$l\" ] || exit 0; read -rp \"Path (default current dir): \" p; herdr-newspace \"$l\" \"${p:-$PWD}\"'"
description = "new workspace with standard tabs"
width = "60%"
height = "30%"

[theme]
name = "gruvbox"
auto_switch = false

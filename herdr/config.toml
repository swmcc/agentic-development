onboarding = false
[keys]
prefix = "ctrl+a"
goto = "prefix+f"
switch_workspace = "prefix+shift+1..9"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec bash -c 'read -rp \"Label: \" l; [ -n \"$l\" ] || exit 0; read -rp \"Path (default current dir): \" p; herdr-scaffold-workspace --cwd \"${p:-$PWD}\" --label \"$l\"'"
description = "new workspace with standard tabs"
width = "60%"
height = "30%"

# Capture a thought straight into today's daily note, from whatever workspace
# you happen to be in. Timestamped, because /washup cares when a decision was
# made. Requires Obsidian to be running — the CLI drives the app, not the disk.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "exec bash -c 'read -rp \"Note: \" n; [ -n \"$n\" ] || exit 0; obsidian daily:append content=\"- $(date +%H:%M) $n\" >/dev/null && echo \"captured\" || echo \"failed — is Obsidian running?\"; sleep 1'"
description = "capture a thought into today's daily note"
width = "60%"
height = "20%"

# Read a Jira ticket without leaving the terminal — body, status, people,
# links and comments. Talks to the REST API directly rather than through an
# agent: a headless `claude -p` lookup measured 20-30s, which is fine for a
# slash command and useless for a keypress. Needs a token in the Keychain;
# `jira-show` tells you how if it is missing. `q` closes the pager.
[[keys.command]]
key = "prefix+j"
type = "popup"
command = "exec bash -c 'read -rp \"Ticket: \" k; [ -n \"$k\" ] || exit 0; jira-show \"$k\" | glow -p -'"
description = "show a jira ticket"
width = "85%"
height = "85%"

# Bring every repo in ~/Documents/Code/repos.list up to the latest main. Opens a
# pane rather than a popup because the summary table is the point — it lists what
# moved, what was stashed and restored, and anything that needs a hand. The pane
# holds on a keypress so the summary survives the command exiting.
[[keys.command]]
key = "prefix+u"
type = "pane"
command = "exec bash -c '\"$HOME/Documents/Code/update-repos.sh\"; echo; read -rsn1 -p \"── any key to close ──\"'"
description = "update workspace repos to latest main"

# Review the current branch against my own code-review standards before raising
# the MR. Costs a headless claude round trip, so it is a keypress rather than a
# hook — the pre-push nudge is the free tier, this is the real pass. Advisory:
# it cannot block a push or a merge.
[[keys.command]]
key = "prefix+m"
type = "pane"
command = "exec bash -c 'premr; echo; read -rsn1 -p \"── any key to close ──\"'"
description = "review this branch against my review standards"

# The state of the whole world on one keypress: what is blocked on your review,
# what you have in flight, which repos are not where you left them. Collection
# is pure shell — Jira over REST, GitLab over glab, git locally — so it answers
# in under a second where an agent round trip would take half a minute. A popup
# rather than a pane because it is a glance, not a session.
#
# Shift because plain prefix+c is a herdr built-in.
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "exec bash -c '\"$HOME/Documents/Code/agentic-development/c2/bin/c2\" board; echo; read -rsn1 -p \"── any key to close ──\"'"
description = "command centre — what is waiting on you right now"
width = "90%"
height = "80%"

[theme]
name = "vesper"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = true

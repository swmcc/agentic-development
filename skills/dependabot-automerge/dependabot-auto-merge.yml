# Auto-merge Dependabot patch and minor updates once required checks pass.
# Major updates are deliberately left open for a human to review.
#
# Copy to .github/workflows/dependabot-auto-merge.yml
#
# This file is what enforces the patch/minor policy. Branch protection decides
# WHEN a PR may merge; only fetch-metadata decides WHICH PRs are eligible.
#
# Requires, in the same repo:
#   - allow_auto_merge enabled on the repo
#   - branch protection requiring the real test check names
# Without required checks, --auto merges immediately and untested.

name: Dependabot auto-merge

# pull_request_target, not pull_request: Dependabot PRs from a fork context get a
# read-only GITHUB_TOKEN, and `gh pr merge` then fails with a permissions error.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major updates fall through every branch below and stay open.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note on major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major update — not auto-merged. Needs a human to review the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
